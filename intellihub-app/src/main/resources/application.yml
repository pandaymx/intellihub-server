server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: intellihub-server
  config:
    import: optional:classpath:application-local.yml,optional:file:./application-local.yml
  ai:
    model:
      embedding: ${INTELLIHUB_AI_EMBEDDING_PROVIDER:none}
    openai:
      api-key: ${INTELLIHUB_AI_API_KEY:sk-placeholder}
      base-url: ${INTELLIHUB_AI_BASE_URL:https://api.deepseek.com}
      embedding:
        enabled: false
      chat:
        options:
          model: ${INTELLIHUB_AI_MODEL:deepseek-chat}

intellihub:
  rag:
    storage-path: ${INTELLIHUB_RAG_STORAGE_PATH:.intellihub-data/knowledge-store.json}
    pgvector:
      enabled: ${INTELLIHUB_PGVECTOR_ENABLED:false}
      table-name: intellihub_kb_chunks
      dimensions: 768
  agent:
    jdbc-store-enabled: ${INTELLIHUB_AGENT_JDBC_ENABLED:false}
    checkpoint-path: ${INTELLIHUB_AGENT_CHECKPOINT_PATH:.intellihub-data/agent-checkpoints.json}
    session-memory-path: ${INTELLIHUB_AGENT_SESSION_MEMORY_PATH:.intellihub-data/session-memory.json}
  chat:
    sessions-path: ${INTELLIHUB_CHAT_SESSIONS_PATH:.intellihub-data/chat-sessions.json}
  llm:
    default-channel: default-ha
    cache:
      max-size: 256
      idle-ttl: 2h
    embedding:
      enabled: ${INTELLIHUB_EMBEDDING_ENABLED:true}
      channel: gemini-primary
      provider: gemini
      model: ${INTELLIHUB_EMBEDDING_MODEL:gemini-embedding-001}
      dimensions: 768
    channels:
      gemini-primary:
        provider: gemini
        api-keys:
          - ${INTELLIHUB_GEMINI_KEY_1:aq-gemini-placeholder-1}
          - ${INTELLIHUB_GEMINI_KEY_2:aq-gemini-placeholder-2}
          - ${INTELLIHUB_GEMINI_KEY_3:aq-gemini-placeholder-3}
        key-cooldown: 60s
        model: ${INTELLIHUB_GEMINI_MODEL:gemini-3.5-flash-lite}
        temperature: 0.7
        extras:
          thinkingEnabled: true
          thinkingBudget: 1024
      gemini-flash:
        provider: gemini
        api-key: ${INTELLIHUB_GEMINI_KEY_1:aq-gemini-placeholder-1}
        model: gemini-3.8-flash
        temperature: 0.7
        extras:
          thinkingEnabled: true
          thinkingBudget: 1024
      deepseek-primary:
        provider: deepseek
        api-keys:
          - ${INTELLIHUB_DEEPSEEK_KEY_1:sk-ds-placeholder-1}
          - ${INTELLIHUB_DEEPSEEK_KEY_2:sk-ds-placeholder-2}
        key-cooldown: 60s
        model: deepseek-chat
        temperature: 0.7
      qwen-backup:
        provider: qwen
        api-key: ${INTELLIHUB_QWEN_KEY:sk-qwen-placeholder}
        model: qwen-plus
        temperature: 0.7
      ollama-local:
        provider: ollama
        base-url: http://localhost:11434
        model: qwen3:8b
    routes:
      default-ha:
        strategy: FAILOVER
        failure-threshold: 1
        cooldown: 30s
        channels:
          - gemini-primary
          - gemini-flash
          - deepseek-primary
          - qwen-backup
          - ollama-local
